[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-queries"
version = "0.1.0"
description = "Certified threshold decisions over revisable scientific data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.7",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scipy==1.16.3",
]

[project.optional-dependencies]
dev = ["black==24.10.0", "flake8==7.1.1", "pytest==8.4.2"]

[project.scripts]
threshold-queries = "threshold_queries.workflow:main"
threshold-queries-check = "threshold_queries.inputs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
