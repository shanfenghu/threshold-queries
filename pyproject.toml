[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-queries"
version = "0.1.0"
description = "Certified threshold decisions over revisable scientific data"
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.7",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scipy==1.16.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
